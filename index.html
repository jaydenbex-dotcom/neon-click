<!DOCTYPE html>
<html>
  <head>
    <title>Neon Click</title>
    <meta name="viewport" content="width=device-width,
      initial-scale=1.0">
      <style>
        body {
          background: #080818;
          color: white;
          font-family: Arial;
          text-align: center;
          paddint-top: 100px;
        }
        h1 { color: #00ffff; }
        #account {
          font-size: 70px;
          color: #ff000ff;
          margin: 30px;
        }
        button {
          paddding: 15px 25px;
          margin: 10px;
          border: none;
          border-radius: 10px;
          background: #00ffff;
          font-size: 18px;
          cursor: pointer;
        }
        button:hover {background: #ff00ff; }
        </style>
  </head>
<body>
  <h1>NEON CLICK </h1>
  <p>Test your clicking power!</p>
  <div id="count">0</div>
  <button onclick="add()">CLICK ME</button>button>
  <button onclick="reset()">RESET</button>
  <script>
    let score = 0;
    function add() {
      score++
      document.getElementById("count").textContent = score;
    }
    function reset() {
      score = 0;
      document.getElementById("count").textContent = score;
    }
</script>
</body>
</html>
